<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Pruebas Unitarias</title>

    <h1>Pruebas de API con QUnit</h1>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script>
QUnit.module("Pruebas de la API REST - registroEmpleado");
const urlAPI = "http://localhost/PruebaUnitaria-Autos/backend/api.php";
QUnit.test("registroEmpleado - Datos correctos", assert => {
    const done = assert.async();
    $.ajax({
        url: '../backend/apiRest.php',
        type: "POST",
        data: {
            accion: "registrarEmpleado",
            cedula_Empleado: "1",
            nombre_Empleado: "admin",
            apellido_Empleado: "admin",
            correo_Empleado: "admin2@gmail.com",
            clave_Empleado: "123"
        },
        success: function(response) {
            assert.equal(response.mensaje, "Empleado creado correctamente", "Empleado registrado correctamente.");
            done();
        },
        error: function() {
            assert.ok(false, "Error en la solicitud Ajax.");
            done();
        }
    });
});
