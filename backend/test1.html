<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pruebas Unitarias</title>
    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.16.0.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/qunit/qunit-2.16.0.js"></script>
</head>
<body>
    <h1>Pruebas de API con QUnit</h1>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script>
        QUnit.module("Pruebas de API - Registro de Usuario");
        
        QUnit.test("Registrar usuario - datos correctos", function (assert) {
            const done = assert.async();
            $.ajax({
                url: '../backend/apiRest.php',
                type: 'POST',
                data: {
                    accion: 'registrarUsuario',
                    nombre_Registro: 'Fernando',
                    apellido_Registro: 'Sanchez',
                    correo_Registro: 'fer@gmail.com',
                    clave_Registro: '123'
                },
                success: function (response) {
                    assert.equal(response.mensaje, 'Usuario creado exitosamente', 'El usuario debe registrarse correctamente');
                    done();
                },
                error: function () {
                    assert.ok(false, 'Error en la solicitud Ajax');
                    done();
                }
            });
        });

        QUnit.test("Registrar usuario - datos incompletos", function (assert) {
            const done = assert.async();
            $.ajax({
                url: '../backend/apiRest.php',
                type: 'POST',
                data: {
                    accion: 'registrarUsuario',
                    nombre_Registro: '', 
                    apellido_Registro: 'Sanchez',
                    correo_Registro: 'fer@gmail.com',
                    clave_Registro: '123'
                },
                success: function (response) {
                    assert.notEqual(response.mensaje, 'Usuario creado exitosamente', 'Debe mostrar un error al faltar datos');
                    done();
                },
                error: function () {
                    assert.ok(false, 'Error en la solicitud Ajax');
                    done();
                }
            });
        });

        QUnit.test("Registrar usuario - datos erróneos", function (assert) {
            const done = assert.async();
            $.ajax({
                url: '../backend/apiRest.php',
                type: 'POST',
                data: {
                    accion: 'registrarUsuario',
                    nombre_Registro: 'Fernando',
                    apellido_Registro: 'Sanchez',
                    correo_Registro: 'correo_invalido', // Correo no válido
                    clave_Registro: '123'
                },
                success: function (response) {
                    assert.notEqual(response.mensaje, 'Usuario creado exitosamente', 'Debe mostrar un error al ingresar un correo no válido');
                    done();
                },
                error: function () {
                    assert.ok(false, 'Error en la solicitud Ajax');
                    done();
                }
            });
        });

        QUnit.test("Registrar usuario - datos vacíos", function (assert) {
            const done = assert.async();
            $.ajax({
                url: '../backend/apiRest.php',
                type: 'POST',
                data: {
                    accion: 'registrarUsuario',
                    nombre_Registro: '',
                    apellido_Registro: '',
                    correo_Registro: '',
                    clave_Registro: ''
                },
                success: function (response) {
                    assert.notEqual(response.mensaje, 'Usuario creado exitosamente', 'Debe mostrar un error al faltar todos los datos');
                    done();
                },
                error: function () {
                    assert.ok(false, 'Error en la solicitud Ajax');
                    done();
                }
            });
        });
        
    </script>
</body>
</html>
